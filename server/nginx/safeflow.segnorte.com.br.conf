# SegCRM — Nginx → PM2 em 127.0.0.1:4000
# Domínio: safeflow.segnorte.com.br
#
# 1) DNS A/AAAA apontando para o IP da VPS
# 2) server/.env com:
#      CORS_ORIGIN=https://safeflow.segnorte.com.br
#      COOKIE_SECURE=true
#      HOST=127.0.0.1
#      PORT=4000
# 3) Instalar:
#      sudo cp server/nginx/safeflow.segnorte.com.br.conf /etc/nginx/sites-available/
#      sudo ln -sf /etc/nginx/sites-available/safeflow.segnorte.com.br.conf /etc/nginx/sites-enabled/
#      # Se ainda NÃO tiver certificado, comente o bloco 443 e use só o 80 (proxy),
#      # ou rode certbot (abaixo) que ajusta o SSL.
#      sudo nginx -t && sudo systemctl reload nginx
#      sudo certbot --nginx -d safeflow.segnorte.com.br

server {
    listen 80;
    listen [::]:80;
    server_name safeflow.segnorte.com.br;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 60s;
    }
}

